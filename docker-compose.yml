version: '3.8'

services:
  casaos-reborn:
    image: lorezno0010/casaos-reborn:latest
    container_name: casaos-reborn
    privileged: true
    restart: always
    ports:
      - "1111:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/orangepi/casaos-reborn-config:/app/backend/data
    environment:
      - PORT=3000
      - JWT_SECRET=supersecretcasaoskey
      - ADMIN_USER=admin
      - ADMIN_PASS=casaos
