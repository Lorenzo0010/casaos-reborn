<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CasaOS Updater</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f1117;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #1a1d27;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
    }
    p {
      color: #9ca3af;
      margin-bottom: 30px;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    button:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }
    .logs {
      margin-top: 30px;
      background: #111827;
      padding: 15px;
      border-radius: 8px;
      height: 200px;
      overflow-y: auto;
      text-align: left;
      font-family: monospace;
      font-size: 13px;
      color: #d1d5db;
      display: none;
    }
    .log-entry {
      margin-bottom: 4px;
    }
    .log-success { color: #10b981; }
    .log-error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Aggiornamento CasaOS Reborn</h1>
    <p>Usa questo strumento isolato per forzare l'aggiornamento sicuro del container principale.</p>
    
    <button id="updateBtn">Forza Aggiornamento (Pull & Recreate)</button>
    
    <div class="logs" id="logsPanel"></div>
  </div>

  <script>
    const updateBtn = document.getElementById('updateBtn');
    const logsPanel = document.getElementById('logsPanel');

    function appendLog(text, type = 'info') {
      const el = document.createElement('div');
      el.className = 'log-entry ' + (type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : '');
      el.textContent = '> ' + text;
      logsPanel.appendChild(el);
      logsPanel.scrollTop = logsPanel.scrollHeight;
    }

    updateBtn.addEventListener('click', async () => {
      updateBtn.disabled = true;
      logsPanel.style.display = 'block';
      logsPanel.innerHTML = '';
      
      try {
        const response = await fetch('/api/update', { method: 'POST' });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const lines = decoder.decode(value).split('\n');
          for (let line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.substring(6));
              appendLog(data.message, data.status);
              
              if (data.status === 'success') {
                setTimeout(() => {
                  window.location.href = window.location.origin.replace(':1112', ':1111');
                }, 3000);
              }
            }
          }
        }
      } catch (err) {
        appendLog('Errore di rete: ' + err.message, 'error');
      } finally {
        updateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
